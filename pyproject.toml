[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | vendor
  | third_party
  | templates
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "node_modules",
    "templates",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "node_modules",
    "templates",
]

[tool.ruff.lint]
# Style-only ignores: formatting, modernization, and intentional patterns.
# Reliability rules (DTZ*, B023, PLW1510, S110, ASYNC230/251) are intentionally
# NOT ignored — they catch real bugs and must be fixed, not suppressed.
ignore = ["E203", "F401", "F841", "F541", "E402", "F811", "E501", "E722", "E712", "B008", "BLE001", "UP035", "RUF012", "RUF013", "B017", "B018", "G201", "C401", "TRY002", "EXE001", "SIM102", "RUF059", "UP022", "TRY401", "SIM117", "PLC0206"]
