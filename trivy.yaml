# Trivy's config for the repo-wide filesystem scan (read from the repo root).
scan:
  skip-dirs:
    # A Backstage skeleton with ${{ values.name }} placeholders, not deployed code.
    # Its Spring Boot parent makes Trivy fetch POMs from Maven Central, which rate-limits
    # (429, Retry-After 1800) and fails the whole scan. Services generated from it are
    # scanned in their own repos.
    - templates/java-service/skeleton
