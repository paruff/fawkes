# Point to features directory relative to pytest.ini location
bdd_features_base_dir = features/

# Make sure pytest finds test files. *_steps.py is included because several
# pytest-bdd step-definition modules (infrastructure_steps.py,
# postgresql_steps.py, azure_steps.py) already call scenarios(...) to bind
# a real feature file but were silently never collected under the
# test_*.py-only pattern - a root cause of KL-05's "false coverage" gap.
python_files = test_*.py *_steps.py
python_classes = Test*
python_functions = test_*
