# Pre-commit hooks for Fawkes Internal Product Delivery Platform
# Covers: GitOps, Terraform, Kubernetes, and IDP elements
# Install: make pre-commit-setup
# Run manually: pre-commit run --all-files

# `pre-commit install` (called by make pre-commit-setup) installs every hook
# type below without needing extra flags -- commit-msg is what actually
# enforces Conventional Commits at commit time, matching the regex
# ci-commit-lint.yml checks in CI (AGENTS.md SS7); pre-push runs the slower
# scans (semgrep, trivy).
#
# Hooks that need a tool run it through `scripts/shift-left.sh require-tool`,
# which fails when the tool is missing instead of passing silently
# (SHIFT_LEFT_ALLOW_MISSING=<tool> skips it knowingly). Every hook here runs in
# CI (.github/workflows/pre-commit.yml) or .shift-left.yml says why not.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # ============================================================================
  # General Code Quality
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ["--allow-multiple-documents"]
        exclude: '^(infra/kubernetes/.*helm.*|.*templates?/.*\.ya?ml|mkdocs\.yml)$'
      - id: check-json
        name: Check JSON syntax
        exclude: "^data/"
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1024"]
        exclude: '^platform/apps/.*/upstream/'
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ["--fix=lf"]
      - id: detect-private-key
        name: Detect private keys
        exclude: '^platform/apps/jenkins/credentials-secrets\.yaml$|^scripts/test-check-secret-detection\.sh$'

  # ============================================================================
  # YAML Linting (GitOps/K8s/IDP)
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting (Documentation)
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json", "--fix"]
        # release-please's changelog template uses dash bullets and double
        # blank lines, which permanently conflict with MD004/MD012 here.
        # Machine-generated, not hand-authored.
        exclude: ^CHANGELOG\.md$

  # ============================================================================
  # Terraform Formatting & Validation
  # ============================================================================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        name: Terraform format
        args:
          - --args=-recursive
      - id: terraform_validate
        name: Terraform validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        name: Terraform lint (TFLint)
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--only=terraform_deprecated_interpolation
          - --args=--only=terraform_deprecated_index
          - --args=--only=terraform_unused_declarations
          - --args=--only=terraform_comment_syntax
          - --args=--only=terraform_documented_outputs
          - --args=--only=terraform_documented_variables
          - --args=--only=terraform_typed_variables
          - --args=--only=terraform_naming_convention
          - --args=--only=terraform_required_version
          - --args=--only=terraform_required_providers
          - --args=--only=terraform_unused_required_providers
      - id: terraform_docs
        name: Terraform docs
        args:
          - --args=--config=.terraform-docs.yml
      - id: terraform_tfsec
        name: Terraform security scan (tfsec)
        args:
          - --args=--soft-fail

  # ============================================================================
  # Kubernetes Manifest Validation
  # ============================================================================
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Insert license header
        files: '\.(yaml|yml|tf)$'
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - "#"
        exclude: '^(\.github/|\.pre-commit-config\.yaml|\.shift-left\.yml|\.yamllint|platform/apps/.*/upstream/)'

  # ============================================================================
  # Secret Scanning (single comprehensive check - gitleaks)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks

  # ============================================================================
  # Python Code Quality (ruff format + lint replaces black + flake8)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: ["--fix"]
        exclude: '^templates/.*/skeleton/.*\.py$'
      - id: ruff-format
        name: Format Python with Ruff
        exclude: '^templates/.*/skeleton/.*\.py$'

  # ============================================================================
  # Shell Script Validation & Formatting
  # ============================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        args: ["--severity=warning"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: Format shell scripts with shfmt
        args: ["-i", "2", "-ci", "-bn", "-sr", "-w"]
        exclude: '^scripts/buildplatform\.sh$'

  # ============================================================================
  # Go Code Quality
  # ============================================================================
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint
        name: Lint Go code
        exclude: "^(jenkins-shared-library/|platform/apps-deferred/unleash/examples/)"

  # ============================================================================
  # Custom Local Hooks for Fawkes-Specific Validation
  # ============================================================================
  - repo: local
    hooks:
      # Conventional Commits check, mirroring ci-commit-lint.yml's regex
      # exactly so a commit can't fail in CI after passing here.
      - id: conventional-commit-msg
        name: Check commit message follows Conventional Commits
        entry: |
          bash -c '
            subject=$(head -1 "$1")
            if [[ "$subject" == Merge\ * ]]; then exit 0; fi
            if echo "$subject" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .{1,72}$"; then
              exit 0
            fi
            echo "Commit message does not follow Conventional Commits format:"
            echo "  \"$subject\""
            echo "Expected: type(scope): description, 1-72 chars -- see AGENTS.md"
            echo "Types: feat fix docs style refactor test chore ci perf build revert"
            exit 1
          ' --
        language: system
        stages: [commit-msg]

      # Kubernetes manifest validation with kubeconform (the id stays kubeval
      # so CI and SKIP lists keep working; kubeval itself is unmaintained).
      # Covers platform/ too (not just infra/kubernetes): every StorageClass/
      # VolumeSnapshotClass/etc bug found in #2010-#2018 lived under platform/apps/,
      # which this hook never touched before. -ignore-missing-schemas skips
      # CRD types kubeconform doesn't have a schema for (ArgoCD Application,
      # ApplicationSet, etc.) rather than failing on them.
      - id: kubeval
        name: Validate Kubernetes manifests (kubeconform)
        entry: |
          scripts/shift-left.sh require-tool kubeconform -- bash -c '
            EXCLUDE_PATTERN="values.*\.yaml|kustomization\.yaml|devfiles/|recording-rules\.yaml|scrape-configs\.yaml|aliases\.yaml|dora\.yml"
            find infra/kubernetes platform -name "*.yaml" -o -name "*.yml" | grep -vE "$EXCLUDE_PATTERN" | xargs -I {} kubeconform -strict -ignore-missing-schemas {}
          '
        language: script
        pass_filenames: false
        files: '^(infra/kubernetes|platform)/.*\.(yaml|yml)$'

      # Kustomize build validation
      - id: kustomize-validate
        name: Validate Kustomize builds
        entry: |
          scripts/shift-left.sh require-tool kustomize -- bash -c '
            for dir in $(find infra/kubernetes -name "kustomization.yaml" -exec dirname {} \;); do
              echo "Validating $dir"
              kustomize build "$dir" > /dev/null || exit 1
            done
          '
        language: script
        pass_filenames: false
        files: '^infra/kubernetes/.*kustomization\.yaml$'

      # Backstage catalog validation (IDP)
      - id: backstage-catalog-validate
        name: Validate Backstage catalog files
        entry: |
          scripts/shift-left.sh require-tool yq -- bash -c '
            find . -name "catalog-info.yaml" -o -name "*.catalog-info.yaml" | xargs -I {} bash -c "yq eval . {} > /dev/null && echo \"✓ {}\""
          '
        language: script
        pass_filenames: false
        files: '(catalog-info|\.catalog-info)\.yaml$'

      # ArgoCD Application validation (GitOps) - #1842. The previous version
      # of this hook called `argocd app validate` (a client-side Application-
      # CR schema check that never fetches/renders the underlying chart or
      # kustomize source) and swallowed every failure into a warning echo -
      # it never once failed a build. scripts/render-all-applications.sh
      # actually renders each Application's real source and fails on error;
      # it caught 2 genuine, previously-undetected defects (a kyverno values
      # schema mismatch, an OCI chart reference bug) the first time it ran.
      - id: argocd-validate
        name: Validate ArgoCD applications (render check)
        entry: scripts/render-all-applications.sh
        language: script
        pass_filenames: false
        files: 'platform/apps/.*-application\.yaml$'

      # Helm chart linting (IDP components)
      - id: helm-lint
        name: Lint Helm charts
        entry: |
          scripts/shift-left.sh require-tool helm -- bash -c '
            for chart in infra/kubernetes/*/Chart.yaml; do
              dir=$(dirname "$chart")
              echo "Linting $dir"
              helm lint "$dir" || exit 1
            done
          '
        language: script
        pass_filenames: false
        files: '^infra/kubernetes/.*/Chart\.yaml$'

      # ADR-034: warn on >= in requirements files (must use == exact pins)
      - id: requirements-pin-check
        name: Check requirements pinning (ADR-034)
        entry: |
          bash -c '
            found=0
            for f in "$@"; do
              if grep -nE "^[^#]*>=" "$f" | grep -v "python_requires"; then
                echo "⚠️  $f: ADR-034 requires == exact pins. Found >= above."
                found=1
              fi
            done
            exit $found
          ' --
        language: system
        types: [text]
        files: '(requirements.*\.txt|requirements.*\.in)$'

      # Check for hardcoded secrets in manifests
      - id: check-k8s-secrets
        name: Check for hardcoded secrets in K8s manifests
        entry: |
          bash -c '
            grep -r "kind: Secret" infra/kubernetes/ --include="*.yaml" --include="*.yml" 2>/dev/null \
              | grep -v "stringData: {}" \
              | grep -v "# Example" \
              | grep -v "# Template" \
              && exit 1 || exit 0
          '
        language: system
        pass_filenames: false
        files: '^infra/kubernetes/.*\.(yaml|yml)$'

      # Validate MkDocs configuration (IDP documentation)
      - id: mkdocs-validate
        name: Validate MkDocs configuration
        entry: |
          scripts/shift-left.sh require-tool mkdocs -- bash -c '
            site=$(mktemp -d)
            mkdocs build --verbose --site-dir "$site"
            rc=$?
            rm -rf "$site"
            exit $rc
          '
        language: script
        pass_filenames: false
        files: '^(mkdocs\.yml|docs/.*\.md)$'

      # The offline unit suites (scripts/run-unit-tests.sh, ~25s): on commit
      # when scripts change, and again before push.
      - id: unit-tests
        name: Unit tests (scripts/run-unit-tests.sh)
        entry: scripts/run-unit-tests.sh
        language: script
        pass_filenames: false
        files: ^scripts/
        stages: [pre-commit, pre-push]

  # ============================================================================
  # GitHub Actions and config schemas (uFawkes.dev shift-left spec R2)
  # ============================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows (actionlint)

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        name: Validate workflow schemas
      - id: check-dependabot
        name: Validate dependabot.yml schema

  # ============================================================================
  # Type-check the services' Python (shift-left spec R2, decided 2026-10-06):
  # mypy, non-strict, over services/ and extensions/. Several services each have
  # their own `app` package, which one mypy run would treat as a single module,
  # so mypy runs once per service directory. Directories with errors that predate
  # the hook are listed in .mypy-baseline and skipped until fixed. It runs without
  # the services' dependencies, so missing imports are ignored.
  # ============================================================================
  - repo: local
    hooks:
      - id: mypy
        name: Type-check Python (mypy)
        entry: |
          bash -c '
            rc=0
            for d in $(printf "%s\n" "$@" | cut -d/ -f1-2 | sort -u); do
              if grep -v "^#" .mypy-baseline | cut -d" " -f1 | grep -qx "$d"; then
                echo "mypy: $d is in .mypy-baseline (existing errors), skipped"
                continue
              fi
              mypy --ignore-missing-imports --explicit-package-bases $(printf "%s\n" "$@" | grep "^$d/") || rc=1
            done
            exit $rc
          ' --
        language: python
        additional_dependencies: ["mypy==2.4.0"]
        files: ^(services|extensions)/.*\.py$
        exclude: (^|/)(tests?|conftest)(/|\.py$)|test_

  # ============================================================================
  # Type-check design-system (shift-left spec R2, decided 2026-10-06): the
  # project's own `npm run typecheck` (tsc --noEmit, strict), which needs its
  # dependencies, so it fails loudly when they aren't installed rather than
  # passing. CI runs the same command in code-quality.yml's TypeScript job.
  # ============================================================================
  - repo: local
    hooks:
      - id: tsc
        name: Type-check design-system (tsc)
        entry: |
          scripts/shift-left.sh require-tool npm -- bash -c '
            cd design-system
            [ -d node_modules ] || { echo "design-system/node_modules is missing: run npm ci in design-system"; exit 1; }
            npm run typecheck
          '
        language: script
        pass_filenames: false
        files: ^design-system/.*\.(ts|tsx|json)$

  # ============================================================================
  # Shared shift-left hooks from uFawkesPipe (keep last: the stamps record that
  # every hook above ran). Tools that aren't hooks run through scripts/shift-left.sh.
  # ============================================================================
  - repo: https://github.com/paruff/uFawkesPipe
    rev: v1.11.1-beta.1
    hooks:
      - id: shift-left-parity
      - id: semgrep
      - id: trivy
      - id: shift-left-stamp
      - id: shift-left-stamp-pre-push
