# ============================================================================
# FILE: platform/apps/postgresql/db-shared-dev-credentials.yaml
# PURPOSE: Bootstrap credentials for db-shared-dev's default "app" database
#          (the CNPG bootstrap.initdb database/owner). No service connects
#          to this database directly - every service gets its own database
#          via postInitSQL, with its own existing credentials Secret managed
#          declaratively (see db-shared-dev-cluster.yaml spec.managed.roles).
# NOTE: For development/local use only. In production, use External Secrets
#       Operator with Vault/AWS Secrets Manager.
# SECURITY: Generate a secure random password for any shared or production
#           environment - never reuse this placeholder value.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-shared-dev-credentials
  namespace: fawkes
  labels:
    component: database
    environment: dev
    team: platform
type: Opaque
stringData:
  username: app
  # Generate secure password in production: openssl rand -base64 32
  password: "CHANGE_ME_shared_dev_app_password"
  dbname: app
