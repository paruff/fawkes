# ============================================================================
# FILE: platform/apps/python-fawkes-path/python-fawkes-path-beta-applicationset.yaml
# PURPOSE: #1805 - Phase 2 (Beta) promotion target scaffolding. #1805's
#          scope (canary/blue-green via Argo Rollouts, chaos testing,
#          Backstage portal) is not built yet - none of that exists in
#          python-fawkes-path-gitops today, which only has a plain Deployment.
#
# `automated` is deliberately OMITTED (manual sync only, via `argocd app
# sync` or the UI) rather than wired to auto-promote: there is no quality
# gate, canary rollout, or chaos-test gate to protect a beta environment
# yet (that's #1805's actual scope), so auto-syncing here would silently
# promote straight past every safeguard #1805 exists to add. Flip to
# automated only once at least one of those gates is real.
#
# Per AGENTS.md section 6, ArgoCD Application/ApplicationSet manifests
# require maintainer review before merge - flagging explicitly.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: python-fawkes-path-beta
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - service: python-fawkes-path
            gitopsRepoURL: https://github.com/paruff/python-fawkes-path-gitops.git
  template:
    metadata:
      name: '{{ .service }}-beta'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: python-fawkes-path-beta-appset
        fawkes.io/phase: beta
    spec:
      project: default
      source:
        repoURL: '{{ .gitopsRepoURL }}'
        targetRevision: main
        path: "."
      destination:
        server: https://kubernetes.default.svc
        namespace: fawkes-beta
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 10
