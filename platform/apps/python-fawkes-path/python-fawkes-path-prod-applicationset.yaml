# ============================================================================
# FILE: platform/apps/python-fawkes-path/python-fawkes-path-prod-applicationset.yaml
# PURPOSE: #1806 - Phase 3 (Production/Elite) promotion target scaffolding.
#          #1806's scope (service-mesh traffic splitting, Backstage
#          portal-gated manual approval, error-budget-triggered automated
#          rollback) is not built yet.
#
# `automated` is deliberately OMITTED, same reasoning as the beta
# ApplicationSet but stronger: #1806 explicitly requires a *human-approved*
# portal gate before any production rollout - auto-syncing here would be
# the exact failure mode #1806 exists to prevent, not just a missing nice
# -to-have. Do not flip this to automated; production promotion should
# route through the portal gate once #1806 builds it, not through ArgoCD's
# own auto-sync.
#
# Per AGENTS.md section 6, ArgoCD Application/ApplicationSet manifests
# require maintainer review before merge - flagging explicitly.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: python-fawkes-path-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - service: python-fawkes-path
            gitopsRepoURL: https://github.com/paruff/python-fawkes-path-gitops.git
  template:
    metadata:
      name: '{{ .service }}-prod'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: python-fawkes-path-prod-appset
        fawkes.io/phase: prod
    spec:
      project: default
      source:
        repoURL: '{{ .gitopsRepoURL }}'
        targetRevision: main
        path: "."
      destination:
        server: https://kubernetes.default.svc
        namespace: fawkes-prod
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 10
