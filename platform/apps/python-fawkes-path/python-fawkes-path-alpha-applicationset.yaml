# ============================================================================
# FILE: platform/apps/python-fawkes-path/python-fawkes-path-alpha-applicationset.yaml
# PURPOSE: #1804 - Phase 1 (Alpha) promotion target. Generates one
#          Application per onboarded service (currently just python-fawkes-path)
#          into the alpha environment, using a list generator so a second
#          golden-path service can be onboarded later by adding one list
#          entry rather than a new file.
#
# RELATIONSHIP TO python-fawkes-path-application.yaml (#1887, already merged):
# that plain Application already syncs the same GitOps repo into the
# `fawkes` namespace and is live today. This ApplicationSet targets a
# separate `fawkes-alpha` namespace instead of migrating the live one, to
# avoid a risky same-name ownership handoff on a cluster mid-demo. Kept
# deliberately as an open, flagged item rather than silently duplicating
# forever: once this is proven, retiring python-fawkes-path-application.yaml in
# favor of this ApplicationSet is the natural follow-up cleanup - not done
# here.
#
# Per AGENTS.md section 6, ArgoCD Application/ApplicationSet manifests
# require maintainer review before merge - flagging explicitly.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: python-fawkes-path-alpha
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - service: python-fawkes-path
            gitopsRepoURL: https://github.com/paruff/python-fawkes-path-gitops.git
  template:
    metadata:
      name: '{{ .service }}-alpha'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: python-fawkes-path-alpha-appset
        fawkes.io/phase: alpha
    spec:
      project: default
      source:
        repoURL: '{{ .gitopsRepoURL }}'
        targetRevision: main
        path: "."
      destination:
        server: https://kubernetes.default.svc
        namespace: fawkes-alpha
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 10
