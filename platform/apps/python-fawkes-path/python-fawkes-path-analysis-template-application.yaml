# ============================================================================
# FILE: platform/apps/python-fawkes-path/python-fawkes-path-analysis-template-application.yaml
# PURPOSE: ArgoCD Application syncing python-fawkes-path-analysis-template.yaml
#          (the Argo Rollouts AnalysisTemplate the python-fawkes-path canary
#          Rollout references) from this repo into the fawkes namespace.
#
# WHY THIS EXISTS: live-cluster verification found the python-fawkes-path
# Rollout permanently Degraded/InvalidSpec ("AnalysisTemplate
# 'python-fawkes-path-canary-success' not found") because no ArgoCD
# Application had ever synced this directory's AnalysisTemplate - the
# sibling python-fawkes-path-application.yaml only syncs the *gitops* repo
# (the Rollout/Service/etc.), not this repo's platform/apps/python-fawkes-path/.
# Source is scoped via this directory's kustomization.yaml to just the
# AnalysisTemplate file, so this Application does not also try to raw-apply
# the other Application/ApplicationSet manifests that live alongside it here.
#
# Per AGENTS.md SS6, creating an ArgoCD Application requires human approval
# before merge - this PR proposes it, it does not merge it.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-fawkes-path-analysis-template
  namespace: argocd
  labels:
    app: python-fawkes-path
    app.kubernetes.io/name: python-fawkes-path-analysis-template
    app.kubernetes.io/part-of: fawkes
    app.kubernetes.io/component: progressive-delivery
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/paruff/fawkes.git
    targetRevision: HEAD
    path: platform/apps/python-fawkes-path
  destination:
    server: https://kubernetes.default.svc
    namespace: fawkes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
