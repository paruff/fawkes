# ============================================================================
# FILE: platform/apps/python-fawkes-path/python-fawkes-path-analysis-template.yaml
# PURPOSE: #1805 - Argo Rollouts AnalysisTemplate for canary success gate.
#          Queries Prometheus for the error rate of python-fawkes-path's HTTP
#          server during canary rollout. If error rate exceeds threshold,
#          the canary is marked as failed and Argo Rollouts triggers rollback.
#
# Prometheus endpoint: prometheus.monitoring.svc.cluster.local:9090
# (from platform/apps/prometheus/prometheus-application.yaml, fullnameOverride: prometheus)
#
# Query verified against python-fawkes-path's actual source (app/main.py):
# Counter("http_requests_total", ..., ["method", "endpoint", "status"]) - no
# "app" label on the metric itself, and the status label is "status", not
# "code". python-fawkes-path-gitops/servicemonitor.yaml sets no targetLabels, so
# Prometheus Operator only auto-injects the standard ServiceMonitor labels
# (namespace, service, pod, job) - "app" is not among them either. The query
# below was updated accordingly (was previously a placeholder using
# app="..."/code=~"5.." from a generic FastAPI assumption, never verified).
#
# Per AGENTS.md section 6, this manifest requires maintainer review before
# merge - flagging explicitly.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: python-fawkes-path-canary-success
  namespace: fawkes
  labels:
    app: python-fawkes-path
    component: progressive-delivery
    managed-by: fawkes
spec:
  args:
    - name: service-name
      # Default to the python-fawkes-path service name; can be overridden by
      # the Rollout's analysisRef args if needed.
      value: python-fawkes-path
    - name: namespace
      value: fawkes
    - name: error-rate-threshold
      # Maximum acceptable error rate (0.05 = 5%) during canary.
      value: "0.05"
    - name: prometheus-endpoint
      value: http://prometheus.monitoring.svc.cluster.local:9090
  metrics:
    - name: error-rate
      # Run this metric check every 60s during canary rollout.
      interval: 60s
      # Count of consecutive failures before marking canary as failed.
      # 3 failures x 60s interval = 3 minute observation window.
      count: 3
      successCondition: "result[0] < {{args.error-rate-threshold}}"
      # If the metric doesn't exist or Prometheus errors out, fail
      # conservatively — a missing error metric should not be treated as
      # success during a canary.
      failureLimit: 0
      provider:
        prometheus:
          address: "{{args.prometheus-endpoint}}"
          # Verified live against the running fawkes-dev-aks cluster:
          # `kubectl port-forward -n fawkes svc/python-fawkes-path 8000:80` then
          # `curl -L http://localhost:8000/metrics` (note: /metrics 307s to
          # /metrics/) returns exactly
          # http_requests_total{endpoint="...",method="...",status="..."} -
          # a plain Counter, no "app" label. namespace/service come from the
          # ServiceMonitor's auto-injected target labels, not the metric
          # itself.
          query: |
            sum(rate(http_requests_total{
              namespace="{{args.namespace}}", service="{{args.service-name}}", status=~"5.."
            }[2m]))
            /
            sum(rate(http_requests_total{
              namespace="{{args.namespace}}", service="{{args.service-name}}"
            }[2m]))
