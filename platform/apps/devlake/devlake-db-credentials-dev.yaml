# ============================================================================
# FILE: platform/apps/devlake/devlake-db-credentials-dev.yaml
# PURPOSE: Local-dev-only Secret unblocking DevLake (#1815).
#
# Only the encryption secret is a real Secret reference here - the chart's
# mysql.password/rootPassword and grafana.adminPassword are flat inline
# string fields in devlake-application.yaml's Helm values instead (no
# existingSecret/secretName mechanism exists for those on this chart's
# actual schema - earlier assumptions that they did were wrong, see that
# file's own comments). DEV DEFAULT values (see #1797 for the tracked
# Sealed Secrets rollout for staging/prod).
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: devlake-encryption-secret
  namespace: fawkes
  labels:
    app: devlake
    component: lake
    team: platform
type: Opaque
stringData:
  # Encrypts DevLake's stored data-source credentials/tokens (GitHub PAT,
  # etc.) at rest. Generated per the chart's own suggested command:
  # openssl rand -base64 2000 | tr -dc 'A-Z' | fold -w 128 | head -n 1
  ENCRYPTION_SECRET: "IWJAVLMXBNSWZTQAXUIDSYANZPHITERQUCDDMNAXWJRFGBSALLVNPIYSLJBIDGIMZMEHNKRILCLTHBGXESXILOIZDYEWDCWSAKOBKBTQHQMVEGMCLMCGIKPGLGELGXBD"
