# ============================================================================
# FILE: platform/apps/devlake/devlake-db-credentials-dev.yaml
# PURPOSE: Local-dev-only plain Secrets unblocking DevLake (#1815), replacing
#          externalsecret-devlake.yaml for this cluster only.
#
# externalsecret-devlake.yaml requires External Secrets Operator + a real
# backing store (Vault/AWS/Azure) - neither exist on this cluster - so it
# can never resolve here. It also has two bugs unrelated to that: its
# ExternalSecret targets namespace "fawkes-devlake" (DevLake's Application
# actually deploys to "fawkes") and creates a Secret named
# "devlake-mysql-secrets" (the chart's own values.yaml references
# "devlake-db" via mysql.auth.existingSecret) - so even a fully working
# ESO+backing-store setup would not have unblocked DevLake as configured.
#
# DEV DEFAULT: values below are randomly generated, local-dev-only (see
# #1797 for the tracked Sealed Secrets rollout for staging/prod) - same
# pattern already used for Harbor/SonarQube's dev-mode credentials.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: devlake-db
  namespace: fawkes
  labels:
    app: devlake
    component: database
    team: platform
type: Opaque
stringData:
  mysql-root-password: "of51JBDIbWRgzuwGAwhgEQ3G"
  mysql-password: "iK0rYLatPDaYCOKHPxJw3WGM"
---
apiVersion: v1
kind: Secret
metadata:
  name: devlake-grafana-secrets
  namespace: fawkes
  labels:
    app: devlake
    component: grafana
    team: platform
type: Opaque
stringData:
  admin-password: "sbzZxOgdNaKw3wu3uIe3gHNq"
