apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devlake
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://apache.github.io/devlake-helm-chart
    chart: devlake
    targetRevision: 1.0.2
    helm:
      values: |
        # ============================================================
        # DevLake Core Configuration
        # Apache DevLake for DORA Metrics Collection and Visualization
        #
        # This values block was rewritten from scratch (#1815) against the
        # chart's *actual* schema (verified via `helm show values`), not
        # guessed conventions from a generic bitnami-style chart. The
        # original version used entirely fictional keys throughout
        # (lake.image, ui.image, grafana.image, mysql.auth.existingSecret,
        # mysql.resources/persistence, service.*, ingress.hosts[], config.
        # metrics.*, top-level securityContext) that this chart doesn't
        # have - never caught because the chart repo URL 404'd until fixed
        # in this same PR, so this Application had never actually rendered
        # before. Everything not explicitly set below uses the chart's own
        # (sane) defaults - see `helm show values devlake/devlake` for the
        # full schema.
        # ============================================================

        imageTag: v1.0.2

        # DEV DEFAULT: generated, local-dev-only value (see #1797 for the
        # tracked Sealed Secrets rollout) - mysql.password/rootPassword are
        # flat top-level fields on this chart, not mysql.auth.*.
        mysql:
          username: devlake
          password: "2veFWHWogn3OnTMvJiSueTCQ"
          database: lake
          rootPassword: "XuzzgQEPbUA9jA1qRLEcgVNU"

        lake:
          # The image sets USER to the *string* "devlake", and containerd on
          # this node can't resolve it - every container create failed with
          # "mount callback failed ...: no users found", leaving the lake pod
          # in CreateContainerError for hours (so DevLake collected nothing).
          # Specifying the same identity numerically (devlake = uid/gid 1010,
          # confirmed by inspecting the image) bypasses the name lookup
          # without changing who the process actually runs as.
          securityContext:
            runAsUser: 1010
            runAsGroup: 1010
            fsGroup: 1010

          # Encrypts DevLake's stored data-source credentials/tokens
          # (GitHub PAT, etc.) at rest. secretName references the Secret
          # in devlake-db-credentials-dev.yaml (confirmed working via a
          # real helm template render - the chart's own validate.yaml
          # Helm test hook checks this specific field).
          encryptionSecret:
            secretName: devlake-encryption-secret
            autoCreateSecret: false

          # DevLake's `lake` container loads ~30 plugins sequentially at
          # startup (ae, azuredevops, bamboo, ... github, gitlab, jenkins,
          # jira, ... zentao) before /ping ever responds - confirmed live,
          # this alone takes 55+ seconds. The chart's own default probes
          # (30s initialDelay, 5 failures x 5s period = 55s total budget)
          # killed the container mid-plugin-load every single time,
          # producing a permanent CrashLoopBackOff that looked like an
          # error but was exit code 143 (SIGTERM from the probe itself).
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 5
            failureThreshold: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 5
            failureThreshold: 10
            successThreshold: 1
            timeoutSeconds: 5

        # Consolidated onto prometheus-stack's Grafana instead of running a
        # second one: DevLake's bundled Grafana is a fixed, purpose-built
        # image (devlake-dashboard) with no datasource-provisioning hook in
        # its values schema - it can only ever show DORA data, never
        # metrics/logs/traces. prometheus-stack's Grafana is the standard
        # chart, already has Loki/Tempo wired in as additionalDataSources,
        # and is the more capable instance to consolidate onto (the chart's
        # own values.yaml documents this exact external-Grafana pattern:
        # "if grafana enabled is false, then external url should be
        # provided"). DevLake's own DORA dashboard JSON still needs
        # importing into that instance separately - not achievable via
        # Helm values alone, tracked as a manual follow-up.
        grafana:
          enabled: false
          external:
            url: "http://prometheus-stack-grafana.monitoring.svc.cluster.local"

        # Ingress left disabled - ingress-nginx isn't deployed on this
        # cluster yet. Access via `kubectl port-forward` for now; revisit
        # once ingress-nginx is live.
        ingress:
          enabled: false

        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: "/metrics"
  destination:
    server: https://kubernetes.default.svc
    namespace: fawkes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
