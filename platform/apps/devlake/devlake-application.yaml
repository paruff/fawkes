apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devlake
  namespace: fawkes
spec:
  project: default
  source:
    repoURL: https://apache.github.io/devlake-helm-chart
    chart: devlake
    targetRevision: 1.0.2
    helm:
      values: |
        # ============================================================
        # DevLake Core Configuration
        # Apache DevLake for DORA Metrics Collection and Visualization
        #
        # This values block was rewritten from scratch (#1815) against the
        # chart's *actual* schema (verified via `helm show values`), not
        # guessed conventions from a generic bitnami-style chart. The
        # original version used entirely fictional keys throughout
        # (lake.image, ui.image, grafana.image, mysql.auth.existingSecret,
        # mysql.resources/persistence, service.*, ingress.hosts[], config.
        # metrics.*, top-level securityContext) that this chart doesn't
        # have - never caught because the chart repo URL 404'd until fixed
        # in this same PR, so this Application had never actually rendered
        # before. Everything not explicitly set below uses the chart's own
        # (sane) defaults - see `helm show values devlake/devlake` for the
        # full schema.
        # ============================================================

        imageTag: v1.0.2

        # DEV DEFAULT: generated, local-dev-only value (see #1797 for the
        # tracked Sealed Secrets rollout) - mysql.password/rootPassword are
        # flat top-level fields on this chart, not mysql.auth.*.
        mysql:
          username: devlake
          password: "2veFWHWogn3OnTMvJiSueTCQ"
          database: lake
          rootPassword: "XuzzgQEPbUA9jA1qRLEcgVNU"

        lake:
          # The image sets USER to the *string* "devlake", and containerd on
          # this node can't resolve it - every container create failed with
          # "mount callback failed ...: no users found", leaving the lake pod
          # in CreateContainerError for hours (so DevLake collected nothing).
          # Specifying the same identity numerically (devlake = uid/gid 1010,
          # confirmed by inspecting the image) bypasses the name lookup
          # without changing who the process actually runs as.
          securityContext:
            runAsUser: 1010
            runAsGroup: 1010
            fsGroup: 1010

          # Encrypts DevLake's stored data-source credentials/tokens
          # (GitHub PAT, etc.) at rest. secretName references the Secret
          # in devlake-db-credentials-dev.yaml (confirmed working via a
          # real helm template render - the chart's own validate.yaml
          # Helm test hook checks this specific field).
          encryptionSecret:
            secretName: devlake-encryption-secret
            autoCreateSecret: false

        # DEV DEFAULT: generated, local-dev-only value - grafana.adminPassword
        # is a flat top-level string on this chart, not a secret reference
        # (adminPasswordSecretName/Key don't exist on this schema).
        grafana:
          adminPassword: "7i0xnKeONqDOvIHM5whRDyW9"

        # Ingress left disabled - ingress-nginx isn't deployed on this
        # cluster yet. Access via `kubectl port-forward` for now; revisit
        # once ingress-nginx is live.
        ingress:
          enabled: false

        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: "/metrics"
  destination:
    server: https://kubernetes.default.svc
    namespace: fawkes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
