# ============================================================================
# FILE: platform/apps/space-metrics/space-metrics-application.yaml
# PURPOSE: ArgoCD Application for the SPACE Metrics Collection Service
#          (Satisfaction, Performance, Activity, Communication, Efficiency -
#          see https://space-framework.com/) - deploys via Kustomize.
# PREREQ: db-shared-dev PostgreSQL cluster (platform/apps/postgresql) must be
#         Healthy first - see db-space-metrics-credentials.yaml there.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: space-metrics
  namespace: argocd
  labels:
    app: space-metrics
    component: devex
    environment: dev
    team: platform
spec:
  project: default

  source:
    repoURL: https://github.com/paruff/fawkes.git
    path: platform/apps/space-metrics
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: fawkes

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 10
