apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dora-metrics
  namespace: fawkes
  labels:
    app: dora-metrics
    component: devex
spec:
  selector:
    matchLabels:
      app: dora-metrics
  namespaceSelector:
    matchNames:
      - fawkes
  endpoints:
    - port: http
      path: /metrics
      # Match the app's own CACHE_TTL_SECONDS (600s default) - scraping
      # more often than the cache refreshes just re-reads the same cached
      # value and wastes a GitHub API round trip on cache-miss ties.
      interval: 300s
