apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-metrics
  namespace: fawkes
  labels:
    app: dora-metrics
    app.kubernetes.io/name: dora-metrics
    app.kubernetes.io/component: devex
    app.kubernetes.io/part-of: fawkes
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dora-metrics
  template:
    metadata:
      labels:
        app: dora-metrics
        app.kubernetes.io/name: dora-metrics
        app.kubernetes.io/component: devex
        app.kubernetes.io/part-of: fawkes
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # ghcr.io/paruff/fawkes-dora-metrics is amd64-only (no multi-arch
      # build exists) - required on mixed-arch clusters (e.g. the LAN
      # homelab's arm64 Lima VM + amd64 mini-gamer node) to avoid
      # scheduling onto an incompatible node and crashing with "exec
      # format error" - live-verified gap, same pattern documented in
      # python-fawkes-path-gitops's own Rollout manifest.
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: dora-metrics
      # dora-metrics-github-token: created live on the cluster (kubectl
      # create secret generic), not committed - same pattern as
      # tekton-gitops-github-token (#1797). gh CLI reads GH_TOKEN directly,
      # no login/config file needed.
      # ghcr-pull-secret: reuses the same GHCR pull credential created for
      # space-metrics (both images are private under the same account).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dora-metrics
          image: ghcr.io/paruff/fawkes-dora-metrics:7c9a52b4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dora-metrics-github-token
                  key: token
            - name: DORA_METRICS_REPO
              value: "paruff/fawkes"
            - name: HOME
              value: "/tmp"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
