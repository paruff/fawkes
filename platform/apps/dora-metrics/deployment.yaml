apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-metrics
  namespace: fawkes
  labels:
    app: dora-metrics
    version: latest
    app.kubernetes.io/name: dora-metrics
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fawkes
    app.kubernetes.io/managed-by: argocd
    team: platform-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dora-metrics
  template:
    metadata:
      labels:
        app: dora-metrics
        app.kubernetes.io/name: dora-metrics
        app.kubernetes.io/version: latest
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: fawkes
        team: platform-team
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dora-metrics
          image: ghcr.io/paruff/dora-metrics:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ARGOCD_BASE_URL
              value: "http://argocd-server.argocd.svc:80"
            - name: GITHUB_REPO
              value: "paruff/fawkes"
            - name: SCRAPE_INTERVAL
              value: "60"
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dora-metrics-argocd-token
                  key: token
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dora-metrics-github-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
