# ============================================================================
# FILE: platform/apps/dora-metrics/dora-metrics-application.yaml
# PURPOSE: ArgoCD Application for the fawkes-on-fawkes DORA self-measurement
#          service (docs/elite-engineering-bridge-plan.md Phase 5) - exposes
#          Deployment Frequency and Lead Time for Changes for paruff/fawkes
#          itself, computed live from GitHub PR data (no DevLake, decommissioned
#          - see EXECUTION_QUEUE.md). Deploys via Kustomize.
# PREREQ: dora-metrics-github-token secret (key: token) must exist in the
#         fawkes namespace - a GitHub token with read access to paruff/fawkes
#         PRs, created live on the cluster (not committed - see #1797).
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dora-metrics
  namespace: argocd
  labels:
    app: dora-metrics
    component: devex
    environment: dev
    team: platform
spec:
  project: default

  source:
    repoURL: https://github.com/paruff/fawkes.git
    path: platform/apps/dora-metrics
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: fawkes

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 10
