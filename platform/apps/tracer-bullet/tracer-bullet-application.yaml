# ============================================================================
# FILE: platform/apps/tracer-bullet/tracer-bullet-application.yaml
# PURPOSE: #1804/#1808 - ArgoCD Application syncing the tracer-bullet golden
#          path example service from its desired-state GitOps repo
#          (paruff/tracer-bullet-gitops) into the fawkes namespace. This is
#          the missing link between the Tekton golden-path pipeline
#          (platform/apps/tekton/golden-path-pipeline.yaml, which opens a
#          GitOps PR against that repo on image promotion) and an actual
#          running pod - without this Application, ArgoCD has nothing
#          watching that repo at all.
#
# Per AGENTS.md section 6 ("Must Ask Before": creating or modifying ArgoCD
# Application manifests), this was drafted by an agent and must not be
# merged without maintainer review.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracer-bullet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paruff/tracer-bullet-gitops.git
    targetRevision: main
    path: "."
  destination:
    server: https://kubernetes.default.svc
    namespace: fawkes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
