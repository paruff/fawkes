# ============================================================================
# FILE: platform/apps/chaos-mesh/experiments/tracer-bullet-network-delay.yaml
# PURPOSE: #1941 - second concrete Chaos Mesh experiment: inject network
#          latency into tracer-bullet and confirm the canary
#          AnalysisTemplate (progressive-delivery issues, separate) actually
#          detects degraded behavior.
#
# Latency: 300ms with 50ms jitter - large enough to meaningfully degrade
# p99 latency against tracer-bullet's fast baseline (a "hello world"
# FastAPI service, normally single-digit ms) without being so extreme
# (e.g. multi-second) that it would trivially fail any check regardless of
# the AnalysisTemplate's actual sensitivity. Duration: 60s, long enough to
# span several Prometheus scrape intervals for the error-rate/latency
# check to observe.
#
# NOT wired into any ArgoCD Application/kustomization on purpose - same
# reasoning as tracer-bullet-pod-kill.yaml (#1940): auto-sync would fire
# this immediately, which isn't "manually-triggerable only". Apply by hand:
#   kubectl apply -f platform/apps/chaos-mesh/experiments/tracer-bullet-network-delay.yaml
#   kubectl delete -f platform/apps/chaos-mesh/experiments/tracer-bullet-network-delay.yaml
# Requires the Chaos Mesh controller (#1939) installed first.
#
# Namespace: targets `fawkes`, where tracer-bullet actually runs today -
# see tracer-bullet-pod-kill.yaml's header comment for the same namespace
# note and its follow-up caveat.
# ============================================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: tracer-bullet-network-delay
  namespace: chaos-mesh
  labels:
    app: chaos-mesh
    component: resilience
    target: tracer-bullet
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - fawkes
    labelSelectors:
      app: tracer-bullet
  delay:
    latency: "300ms"
    jitter: "50ms"
    correlation: "25"
  duration: "60s"
