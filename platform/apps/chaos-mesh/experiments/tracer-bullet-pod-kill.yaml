# ============================================================================
# FILE: platform/apps/chaos-mesh/experiments/tracer-bullet-pod-kill.yaml
# PURPOSE: #1940 - first concrete Chaos Mesh experiment: kill a running
#          tracer-bullet pod and confirm the Deployment/Rollout self-heals.
#
# NOT wired into any ArgoCD Application/kustomization on purpose - if it
# were auto-synced it would fire the moment it landed, which is exactly
# what "manually-triggerable only" (per the issue) rules out. Apply by
# hand when you want to run this experiment:
#   kubectl apply -f platform/apps/chaos-mesh/experiments/tracer-bullet-pod-kill.yaml
#   kubectl delete -f platform/apps/chaos-mesh/experiments/tracer-bullet-pod-kill.yaml
# Requires the Chaos Mesh controller (#1939) installed first.
#
# Namespace: targets `fawkes`, where tracer-bullet actually runs today
# (confirmed live: `kubectl get pods -n fawkes` shows tracer-bullet-*).
# Re-point at fawkes-alpha/-beta once the phased ApplicationSet promotion
# (#1804) actually migrates it there - tracked as a follow-up, not done
# here since that migration hasn't landed yet.
# ============================================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: tracer-bullet-pod-kill
  namespace: chaos-mesh
  labels:
    app: chaos-mesh
    component: resilience
    target: tracer-bullet
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - fawkes
    labelSelectors:
      app: tracer-bullet
