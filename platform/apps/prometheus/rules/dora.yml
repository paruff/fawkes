# DORA Metrics Recording Rules — rewritten 2026-09-16 against REAL, live-verified
# metric names on fawkes-dev-aks. Targets the exact 5 metric names
# platform/apps/grafana-dashboards/dora-metrics-dashboard-configmap.yaml's
# "DORA 2026 — Five Key Metrics" panel queries (that dashboard is the ArgoCD-
# managed one; two other "DORA dashboard" files elsewhere in this repo
# (platform/apps/prometheus/dora-metrics-dashboard.yaml,
# platform/apps/grafana/dashboards/dora-metrics-dashboard.json) are NOT wired
# into any ArgoCD Application and use yet another incompatible naming scheme -
# not reconciled here, flagged as a separate cleanup).
#
# Deploy target: platform/apps/prometheus/prometheus-application.yaml's
# additionalPrometheusRulesMap (kept in sync by hand - this file is the
# readable reference copy, not the live source).
#
# Real source metrics confirmed live on fawkes-dev-aks 2026-09-16:
# - argocd_app_sync_total{name,namespace,project,dest_server,dry_run,phase}
#   (phase="Succeeded"|"Failed") - argocd-application-controller-metrics:8082
# - tekton_pipelines_controller_pipelinerun_duration_seconds_bucket
#   {namespace,pipeline,status} - tekton-pipelines-controller:9090
# - ALERTS / ALERTS_FOR_STATE{alertname="ArgoCDAppDegraded"} - Prometheus's
#   own alerting engine output, confirmed reaching Alertmanager live
#   (/api/v2/alerts showed it "active") after a real devlake Degraded
#   incident on this cluster.
#
# Lead Time uses raw cumulative bucket sums, not rate()/increase() - with
# only a handful of real PipelineRuns so far, rate()/increase() over a 30d
# window returned NaN (needs 2+ samples spaced apart to compute a slope,
# confirmed live). Revisit once real PipelineRun volume is high enough for
# rate() to behave, so this stops being effectively all-time instead of a
# rolling window.
#
# FDRT/MTTR uses REAL Alertmanager-backed incident data now, not a proxy -
# ALERTS_FOR_STATE for the ArgoCDAppDegraded alert defined below, which
# actually fires through Prometheus's alerting engine and reaches
# Alertmanager. Still a simplification: this only covers currently-firing
# incidents (average duration so far), not a rolling history of resolved
# ones - Prometheus doesn't retain ALERTS_FOR_STATE once an alert resolves,
# so this can't yet compute a true historical p50 over 30d. Real, live,
# honestly labeled - not yet a full distribution.
#
# Rework Rate remains a proxy (see its own comment below) - no ADR or
# other authoritative definition exists in this repo for what "rework"
# means here; the dashboard panel referencing it says "ADR-006: DORA
# Metric Definitions" but ADR-006 in this repo is actually about Postgres,
# a stale/wrong cross-reference found during the same investigation.

groups:
- name: dora-alerts
  rules:
  # Fires when an ArgoCD-managed app goes Degraded or Missing for 1+ minute.
  # This is the actual incident signal FDRT/MTTR below reads from - it's a
  # real Prometheus alerting rule, not a synthetic metric, so it genuinely
  # exercises the Alertmanager pipeline (confirmed live: reaches
  # Alertmanager's /api/v2/alerts as "active").
  - alert: ArgoCDAppDegraded
    expr: argocd_app_info{health_status=~"Degraded|Missing"} == 1
    for: 1m
    labels:
      severity: warning
      source: dora-mttr
    annotations:
      summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}"

- name: dora-metrics
  interval: 30s
  rules:
  # Deployment Frequency: successful ArgoCD syncs per day, 30d window.
  - record: dora:deployment_frequency:rate30d
    expr: |
      sum(increase(argocd_app_sync_total{phase="Succeeded"}[30d])) / 30

  # Lead Time for Changes: median Tekton PipelineRun duration.
  # Proxy: pipeline-execution time (commit-received-by-CI to build/deploy-done),
  # not full idea-to-production lead time - no commit-timestamp correlation
  # exists yet to measure that more strictly.
  - record: dora:lead_time_hours:p50_30d
    expr: |
      histogram_quantile(0.5,
        sum(tekton_pipelines_controller_pipelinerun_duration_seconds_bucket{status="success"}) by (le)
      ) / 3600

  # Change Failure Rate: failed syncs / total syncs, 30d window.
  - record: dora:change_failure_rate:ratio30d
    expr: |
      sum(increase(argocd_app_sync_total{phase="Failed"}[30d]))
      /
      sum(increase(argocd_app_sync_total[30d]))

  # Failed Deployment Recovery Time (MTTR): real Alertmanager-backed
  # incident data (see the dora-alerts group above and the file header
  # comment for what's still simplified about this).
  - record: dora:fdrt_hours:p50_30d
    expr: |
      (
        avg(time() - ALERTS_FOR_STATE{alertname="ArgoCDAppDegraded"})
        or vector(0)
      ) / 3600

  # Rework Rate: PROXY - average number of extra syncs per app beyond the
  # first, over the full counter history (not yet windowed to 30d since
  # argocd_app_sync_total has no per-sync timestamp to bucket by age
  # without a recording-rule history of its own). A high value means apps
  # are needing repeated syncs to reach the desired state, which is a
  # reasonable rework signal even if it's not a named-in-any-ADR metric.
  - record: dora:rework_rate:ratio
    expr: |
      (
        sum(argocd_app_sync_total) - count(count by (name) (argocd_app_sync_total))
      )
      /
      count(count by (name) (argocd_app_sync_total))
