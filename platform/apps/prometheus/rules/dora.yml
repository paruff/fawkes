# DORA Metrics Recording Rules
# Computed natively in Prometheus — no DevLake ETL required
#
# 2026-09-16: this file itself was never deployed by anything - the
# prometheus-rules-dora.yaml Application referenced below was never
# created (confirmed: file doesn't exist; zero dora_* metrics live on
# mac-mini-k3s). Actual deploy target is now
# platform/apps/prometheus/prometheus-application.yaml's
# additionalPrometheusRulesMap.dora-metrics (same rules, kept in sync
# by hand - this file is the readable reference copy, not the live source).
#
# Also still needed before any of this produces real data: ArgoCD has no
# metrics Service/ServiceMonitor on this cluster, and Tekton isn't deployed
# on mac-mini-k3s at all - see the prerequisite tracking issue.
#
# Required OTLP Events (emitted by Tekton, ArgoCD, Alertmanager):
# - tekton_pipelinerun_start{commit_sha, pipeline, namespace}
# - tekton_pipelinerun_finished{commit_sha, pipeline, status}
# - argocd_application_sync_started{app, commit_sha, namespace}
# - argocd_application_sync_succeeded{app, commit_sha, namespace}
# - argocd_application_sync_failed{app, commit_sha, namespace}
# - argocd_application_rollback{app, commit_sha, namespace}
# - alertmanager_alert_firing{incident_id, alertname, severity}
# - alertmanager_alert_resolved{incident_id, alertname}
# - service_up{service, namespace, job}
# - service_down{service, namespace, job}

groups:
- name: dora-metrics
  interval: 30s
  rules:
  # --------------------------------------------------------------------------
  # Metric names aligned with Grafana DORA dashboard queries:
  #   dora_deployments_total, dora_lead_time_seconds,
  #   dora_deployment_failures_total, dora_mttr_seconds
  # --------------------------------------------------------------------------

  # Deployment Frequency: count of successful ArgoCD syncs per app/env
  # Dashboard queries: sum(increase(dora_deployments_total{...}[7d]))
  - expr: |
      sum by (app, namespace) (
        increase(argocd_application_sync_succeeded_total[1d])
      )
    record: dora_deployments_total
    labels:
      metric_type: "dora"
      dora_key: "deployment_frequency"

  # Deployment Failure Count: failed syncs (used for Change Failure Rate)
  # Dashboard queries: sum(dora_deployment_failures_total{...}) / sum(dora_deployments_total{...}) * 100
  - expr: |
      sum by (app, namespace) (
        increase(argocd_application_sync_failed_total[1d])
      )
    record: dora_deployment_failures_total
    labels:
      metric_type: "dora"
      dora_key: "change_failure_rate"

  # Lead Time for Changes: commit → production sync (seconds, as histogram)
  # Dashboard queries: avg(dora_lead_time_seconds{...}) / 3600
  # Uses timestamp difference between Tekton PipelineRun start and ArgoCD sync success
  - expr: |
      histogram_quantile(0.5,
        sum by (le, app, namespace) (
          increase(
            (
              argocd_application_sync_succeeded_timestamp_seconds{job="argocd"}
              -
              tekton_pipelinerun_start_timestamp_seconds{job="tekton"}
            ) / 3600
          )[24h]
        )
      ) * 3600
    record: dora_lead_time_seconds
    labels:
      metric_type: "dora"
      dora_key: "lead_time_for_changes"

  # Mean Time to Recovery: alert firing → resolved (seconds)
  # Dashboard queries: avg(dora_mttr_seconds{...}) / 3600
  - expr: |
      histogram_quantile(0.5,
        sum by (le, app, namespace) (
          increase(
            (
              alertmanager_alert_resolved_timestamp_seconds
              -
              alertmanager_alert_firing_timestamp_seconds
            ) / 3600
          )[24h]
        )
      ) * 3600
    record: dora_mttr_seconds
    labels:
      metric_type: "dora"
      dora_key: "mttr"

  # --------------------------------------------------------------------------
  # Additional recording rules for detailed analysis (used in sub-panels)
  # --------------------------------------------------------------------------

  # Deployment Frequency P50 (ratio over 24h, for trend charts)
  - expr: |
      sum by (app, namespace) (
        rate(argocd_application_sync_succeeded_total[24h])
      )
    record: dora:deployment_frequency:ratio_1d
    labels:
      metric_type: "dora"
      dora_key: "deployment_frequency"

  # Lead Time P90
  - expr: |
      histogram_quantile(0.9,
        sum by (le, app, namespace) (
          increase(
            (
              argocd_application_sync_succeeded_timestamp_seconds{job="argocd"}
              -
              tekton_pipelinerun_start_timestamp_seconds{job="tekton"}
            ) / 3600
          )[24h]
        )
      ) * 3600
    record: dora:lead_time_for_changes:p90_seconds
    labels:
      metric_type: "dora"
      dora_key: "lead_time_for_changes"

  # MTTR P90
  - expr: |
      histogram_quantile(0.9,
        sum by (le, app, namespace) (
          increase(
            (
              alertmanager_alert_resolved_timestamp_seconds
              -
              alertmanager_alert_firing_timestamp_seconds
            ) / 3600
          )[24h]
        )
      ) * 3600
    record: dora:mttr:p90_seconds
    labels:
      metric_type: "dora"
      dora_key: "mttr"

  # Reliability (5th DORA key): service availability % meeting SLO over 30d
  - expr: |
      sum by (service, namespace) (
        rate(service_up_total{job="prometheus"}[30d])
      )
      /
      sum by (service, namespace) (
        rate(service_up_total{job="prometheus"}[30d]) + rate(service_down_total{job="prometheus"}[30d])
      )
    record: dora:reliability:ratio_30d
    labels:
      metric_type: "dora"
      dora_key: "reliability"

  # Deployment success rate (for correlation)
  - expr: |
      sum by (app, namespace) (
        rate(argocd_application_sync_succeeded_total[24h])
      )
      /
      sum by (app, namespace) (
        rate(argocd_application_sync_total[24h])
      )
    record: dora:deployment_success_rate:ratio_1d
    labels:
      metric_type: "dora"
      dora_key: "deployment_success_rate"

  # Rollback rate
  - expr: |
      sum by (app, namespace) (
        rate(argocd_application_rollback_total[24h])
      )
      /
      sum by (app, namespace) (
        rate(argocd_application_sync_total[24h])
      )
    record: dora:rollback_rate:ratio_1d
    labels:
      metric_type: "dora"
      dora_key: "rollback_rate"
