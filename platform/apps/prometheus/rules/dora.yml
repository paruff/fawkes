# DORA Metrics Recording Rules — rewritten 2026-09-16 against REAL, live-verified
# metric names on fawkes-dev-aks (the previous version's names were guessed and
# never matched anything real - see git history). Targets the exact 5 metric
# names platform/apps/grafana-dashboards/dora-metrics-dashboard-configmap.yaml's
# "DORA 2026 — Five Key Metrics" panel queries (that dashboard is the ArgoCD-
# managed one; two other "DORA dashboard" files elsewhere in this repo
# (platform/apps/prometheus/dora-metrics-dashboard.yaml,
# platform/apps/grafana/dashboards/dora-metrics-dashboard.json) are NOT wired
# into any ArgoCD Application and use yet another incompatible naming scheme -
# not reconciled here, flagged as a separate cleanup).
#
# Deploy target: platform/apps/prometheus/prometheus-application.yaml's
# additionalPrometheusRulesMap.dora-metrics (kept in sync by hand - this file
# is the readable reference copy, not the live source).
#
# Real source metrics confirmed live on fawkes-dev-aks 2026-09-16:
# - argocd_app_sync_total{name,namespace,project,dest_server,dry_run,phase}
#   (phase="Succeeded"|"Failed") - argocd-application-controller-metrics:8082
# - tekton_pipelines_controller_pipelinerun_duration_seconds_bucket
#   {namespace,pipeline,status} - tekton-pipelines-controller:9090
#
# Two of five keys (FDRT/MTTR and Rework Rate) don't have a clean source
# metric yet - see their rules below for what's actually being computed and
# why it's a proxy, not the textbook definition. Real MTTR needs Alertmanager
# wiring (tracked in #2117); not fabricating a better number than the data
# supports.

groups:
- name: dora-metrics
  interval: 30s
  rules:
  # Deployment Frequency: successful ArgoCD syncs per day, 30d window.
  # Panel: platform/apps/grafana-dashboards/dora-metrics-dashboard-configmap.yaml
  - record: dora:deployment_frequency:rate30d
    expr: |
      sum(increase(argocd_app_sync_total{phase="Succeeded"}[30d])) / 30

  # Lead Time for Changes: median Tekton PipelineRun duration, 30d window.
  # Proxy: pipeline-execution time (commit-received-by-CI to build/deploy-done),
  # not full idea-to-production lead time - no commit-timestamp correlation
  # exists yet to measure that more strictly.
  - record: dora:lead_time_hours:p50_30d
    expr: |
      histogram_quantile(0.5,
        sum(rate(tekton_pipelines_controller_pipelinerun_duration_seconds_bucket{status="success"}[30d])) by (le)
      ) / 3600

  # Change Failure Rate: failed syncs / total syncs, 30d window.
  - record: dora:change_failure_rate:ratio30d
    expr: |
      sum(increase(argocd_app_sync_total{phase="Failed"}[30d]))
      /
      sum(increase(argocd_app_sync_total[30d]))

  # Failed Deployment Recovery Time (MTTR): PROXY, not the textbook
  # incident-to-resolution metric - that needs Alertmanager firing/resolved
  # timestamps, which aren't wired yet (#2117). This instead uses the
  # cumulative sync duration recorded against apps that have had at least
  # one Failed sync, as a rough "how long was spent on the failing app"
  # signal. Revisit once Alertmanager is wired rather than trusting this
  # as real MTTR.
  - record: dora:fdrt_hours:p50_30d
    expr: |
      (
        sum(argocd_app_sync_duration_seconds_total and on(name) argocd_app_sync_total{phase="Failed"})
        or vector(0)
      ) / 3600

  # Rework Rate: PROXY - average number of extra syncs per app beyond the
  # first, over the full counter history (not yet windowed to 30d since
  # argocd_app_sync_total has no per-sync timestamp to bucket by age
  # without a recording-rule history of its own). A high value means apps
  # are needing repeated syncs to reach the desired state, which is a
  # reasonable rework signal even if it's not a named-in-any-ADR metric -
  # see dora.yml's own file header for the ADR-006 mislabeling found in
  # the dashboard this targets.
  - record: dora:rework_rate:ratio
    expr: |
      (
        sum(argocd_app_sync_total) - count(count by (name) (argocd_app_sync_total))
      )
      /
      count(count by (name) (argocd_app_sync_total))
