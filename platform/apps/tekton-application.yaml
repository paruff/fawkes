# ============================================================================
# FILE: platform/apps/tekton-application.yaml
# PURPOSE: ArgoCD Application for Tekton Pipelines + Triggers controllers
#          (Jenkins -> Tekton migration Phase 1, see #1659/#1660/#1661).
#          Jenkins stays fully in place; this only stands up Tekton
#          alongside it so pipeline steps can be ported incrementally.
# ⚠️ DRAFTED BY AGENT - see platform/apps/tekton/README.md "Human review
#    required". Per AGENTS.md §6, must not be merged without maintainer
#    review.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton
  namespace: fawkes
  labels:
    app: tekton
    component: cicd
    environment: dev
    team: platform
  annotations:
    argocd.argoproj.io/docs: "https://tekton.dev/docs/"

spec:
  project: default

  source:
    repoURL: https://github.com/paruff/fawkes.git
    path: platform/apps/tekton
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Tekton's webhook manages this annotation itself post-install
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

  revisionHistoryLimit: 10
