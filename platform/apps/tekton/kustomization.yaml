# ============================================================================
# FILE: platform/apps/tekton/kustomization.yaml
# PURPOSE: Install Tekton Pipelines + Triggers controllers (#1659).
#
# No official, actively-maintained Helm chart exists for Tekton (checked
# Artifact Hub - only low-version/unofficial third-party charts turned up).
# Upstream's own documented install method is applying pinned release YAML
# directly. Vendored locally (platform/apps/tekton/vendor/, ~30k lines,
# mostly CRD schemas) rather than referenced by remote URL: kustomize's
# remote-resource loader misidentifies storage.googleapis.com/<bucket>/<path>
# URLs as git-repo references (its heuristic reads the first two path
# segments as org/repo) and fails with "URL is a git repository" - a known
# kustomize limitation, not something fixable from this side. Vendoring
# also makes ArgoCD sync fully offline-reproducible instead of depending on
# a live fetch from GCS at sync time.
#
# Namespace: left as Tekton's own default (`tekton-pipelines`) rather than
# remapped, since the release YAML hardcodes that namespace in multiple
# RBAC subject references - overriding it via Kustomize risks silently
# breaking ServiceAccount/RoleBinding wiring for a Phase 1 "get it running"
# task. Runs alongside Jenkins (`platform/apps/jenkins/`) with no shared
# resources or namespace collision.
#
# Scope is deliberately limited to the controllers only - no Task/Pipeline/
# Trigger resources yet (those come in a later phase once wiring is proven).
# ============================================================================

resources:
  - vendor/pipeline-v1.15.1.yaml
  - vendor/triggers-v0.37.0.yaml
  - vendor/triggers-interceptors-v0.37.0.yaml
