apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: fawkes-platform
resources:
# Tekton Pipelines v1.16.0 (latest stable) and Triggers v0.37.0 (latest
# stable) upstream release manifests, referenced by URL rather than
# vendored - the CRD-heavy pipeline release alone is >1.5MB and fails this
# repo's check-added-large-files (1MB) and yamllint (upstream isn't
# formatted to this repo's yamllint config) pre-commit hooks. Kustomize
# fetches these at build/sync time; pin the exact tag in the URL so a
# version bump is still an explicit, reviewable PR diff.
- https://infra.tekton.dev/tekton-releases/pipeline/previous/v1.16.0/release.yaml
- https://infra.tekton.dev/tekton-releases/triggers/previous/v0.37.0/release.yaml
- https://infra.tekton.dev/tekton-releases/triggers/previous/v0.37.0/interceptors.yaml
- eventlistener-github-skeleton.yaml
