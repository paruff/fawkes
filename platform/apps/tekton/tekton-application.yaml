# ============================================================================
# FILE: platform/apps/tekton/tekton-application.yaml
# PURPOSE: ArgoCD Application for Tekton Pipelines + Triggers (#1659).
# NOTE: Per AGENTS.md SS6, creating an ArgoCD Application requires human
#       approval before merge - this PR proposes it, it does not merge it.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton
  namespace: argocd
  labels:
    app: tekton
    app.kubernetes.io/name: tekton
    app.kubernetes.io/part-of: fawkes
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/paruff/fawkes.git
    targetRevision: HEAD
    path: platform/apps/tekton
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
