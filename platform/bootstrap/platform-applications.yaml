# ============================================================================
# FILE: platform/bootstrap/platform-applications.yaml
#
# SUPERSEDED BY platform-applicationset.yaml (#1842) - kept in the repo,
# still the live mechanism as of this commit, not deleted from history.
# This file's own directory.recurse approach is itself a workaround, not
# ArgoCD's purpose-built mechanism for "many Applications from a directory":
# it silently failed to register 31 of 44 apps this session (they landed in
# a namespace ArgoCD doesn't watch by default) and produced a live
# RepeatedResourceWarning once a second mechanism (app-of-apps) also tried
# to manage the same objects. See platform-applicationset.yaml's own header
# for the full replacement design and its ApplicationSet `files` generator.
# Cutting the live cluster over to it is a deliberate separate step, done
# only after confirming the ApplicationSet reconciles identical objects -
# not rushed into the same change that introduced it.
#
# PURPOSE (as originally written): The single mechanism that registers every platform Application.
#
# This replaces two conflicting mechanisms that previously ran at once:
#
#   1. applicationset.yaml - a git *directory* generator producing one
#      auto-templated Application per platform/apps/* directory. 29 of 45
#      directories already ship their own hand-written Application with the
#      same name, so it needed a 28-entry exclude list and still collided
#      (observed live as sync/prune churn on tempo/opensearch).
#
#   2. root-apps.yaml's `fawkes-app` - an Application syncing the WHOLE of
#      platform/apps as one blob. That applies every app's raw workload
#      manifests *and* every *-application.yaml as plain resources, fighting
#      both the ApplicationSet and all 45 hand-written Applications for
#      ownership of the same objects.
#
# The repo's actual, consistent convention is "one hand-written Application
# manifest per app". The correct ArgoCD pattern for that is a plain
# app-of-apps directory sync that applies ONLY those manifests - which is
# what `directory.include` below does. No templating, no excludes, no
# second opinion about what each app's Application should look like.
#
# Adding a new platform app = drop in its *-application.yaml. Nothing here
# needs to change.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-applications
  namespace: argocd
  labels:
    app: platform-applications
    component: gitops
    environment: all
    team: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: default
  source:
    repoURL: https://github.com/paruff/fawkes.git
    targetRevision: HEAD
    path: platform/apps
    directory:
      recurse: true
      # Only pick up Application manifests - never the raw workload YAML
      # sitting alongside them (deployment.yaml, values.yaml, dashboards,
      # index templates, ...). Those belong to whichever Application
      # references them, not to this one.
      include: "*-application.yaml"
  destination:
    server: https://kubernetes.default.svc
    # Application objects themselves live in argocd; each one declares its
    # own workload destination namespace.
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
