# The one object applied by hand (scripts/lab-up.sh). Everything else comes from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paruff/fawkes.git
    targetRevision: HEAD
    path: platform/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Never prune: deleting an ApplicationSet takes its Applications with it.
      prune: false
      selfHeal: true
