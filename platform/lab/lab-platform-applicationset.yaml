# Lab (mmm4) subset of platform-applicationset.yaml. The template must stay identical:
# tests/unit/test_lab_cluster.py compares them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lab-platform
  namespace: argocd
spec:
  syncPolicy:
    applicationsSync: create-update
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/paruff/fawkes.git
        revision: HEAD
        files:
          - path: "platform/apps/prometheus/prometheus-application.yaml"
          - path: "platform/apps/ingress-nginx/ingress-nginx-application.yaml"
          - path: "platform/apps/cert-manager/cert-manager-application.yaml"
          - path: "platform/apps/argo-rollouts/argo-rollouts-application.yaml"
  template:
    metadata:
      name: '{{ .metadata.name }}'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: lab-platform-appset
      annotations:
        argocd.argoproj.io/sync-wave: '{{ dig "metadata" "annotations" "argocd.argoproj.io/sync-wave" "0" . }}'
    spec:
      project: '{{ dig "spec" "project" "default" . }}'
      source:
        repoURL: '{{ .spec.source.repoURL }}'
        targetRevision: '{{ .spec.source.targetRevision }}'
        chart: '{{ dig "spec" "source" "chart" "" . }}'
        path: '{{ dig "spec" "source" "path" "" . }}'
        helm:
          values: |
            {{- $v := dig "spec" "source" "helm" "values" "" . }}
            {{- if $v }}
            {{- $v | nindent 12 }}
            {{- else }}
            {{- dig "spec" "source" "helm" "valuesObject" dict . | toYaml | nindent 12 }}
            {{- end }}
      destination:
        server: '{{ .spec.destination.server }}'
        namespace: '{{ .spec.destination.namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/replicas
      revisionHistoryLimit: 10
