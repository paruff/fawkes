# Application Configuration
spring.application.name=${{ values.name }}
server.port=8080

# Actuator Configuration
# Only expose the endpoints required for probes and Prometheus scraping; env/heapdump/etc. remain hidden
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
# Health details only for authorized callers - never 'always' (leaks internals to unauthenticated users)
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.fawkes=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
