# Pipeline declaration (uFawkes.dev docs/ai-sdlc/ci-pipeline/spec.md, R5).
# Only what R5 needs so far; the rest comes with the adoption issue
# (paruff/uFawkes.dev#181).
version: "2"

# Steps that report but must not block. Everything else that can fail the
# build does fail it. The step name in the workflow says "(informational)".
informational:
  - workflow: code-quality.yml
    step: Coverage comment on PR (informational)
    reason: &comment >-
      Posts a comment on the PR. A fork PR's token cannot write comments, and
      a missing comment must not fail the coverage check that produced it.
  - workflow: code-quality.yml
    step: Comment coverage on PR (informational)
    reason: *comment
  - workflow: code-quality.yml
    step: Comment on PR (informational)
    reason: *comment
