# Dependabot configuration for automatic updates
# Keeps GitHub Actions and other dependencies up-to-date
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions - Keep action versions up-to-date
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group all patch updates into a single PR
    groups:
      github-actions-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Python dependencies - Root requirements.txt
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Terraform - Main infrastructure
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
      - "infrastructure"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Terraform - AWS infrastructure
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directory: "/infra/aws"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
      - "infrastructure"
      - "aws"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Terraform - Azure infrastructure
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directory: "/infra/azure"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
      - "infrastructure"
      - "azure"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker - MCP K8s Server
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/services/mcp-k8s-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "mcp-k8s-server"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Hold the base image at Python 3.13 (patch updates still flow). Newer Pythons
    # have no wheels for this image's pinned fastapi/pydantic-core, so pip tries to
    # compile Rust in a slim image with no compiler and the build fails. This was
    # pinned by hand in 5565eff1, then bumped past twice (the last time to the
    # 3.15.0rc2 release candidate, #2179). Revisit when requirements.txt is upgraded.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      pre-commit-hooks:
        patterns: ["*"]
    cooldown:
      default-days: 7
