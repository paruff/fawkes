# .github/ISSUE_TEMPLATE/security.yml
name: 🔒 Security Vulnerability
description: Report a security vulnerability (use private reporting)
title: "[Security]: "
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **STOP!** If this is a security vulnerability, please DO NOT create a public issue.

        Instead, please use GitHub's [Private Vulnerability Reporting](https://github.com/paruff/fawkes/security/advisories/new) or contact the maintainer via the email on the [paruff GitHub profile](https://github.com/paruff)

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Acknowledgment
      description: Please confirm you understand the security reporting process
      options:
        - label: I understand this template is for non-sensitive security discussions only. I will use private reporting for actual vulnerabilities.
          required: true
