name: Main CI Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  dora-start:
    name: DORA job start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:main-ci-guard"

  main-ci-guard:
    name: Main CI Gate
    needs: dora-start
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@v1.2.0
    with:
      workflow-id: code-quality.yml
    permissions:
      checks: write
      pull-requests: write

  dora-finish:
    name: DORA job finish
    needs: main-ci-guard
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: DORA job finish
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
