name: Commit Lint

# A small standalone commit-format check, matching ci-pr-size.yml's pattern.
# The commit-msg hook (conventional-commit-msg) uses the same regex locally.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commit-lint:
    name: "📝 Conventional Commits Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Check commit messages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const regex = /^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .{1,72}$/;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const bad = commits
              .map((c) => c.commit.message.split("\n")[0])
              .filter((subject) => !subject.startsWith("Merge ") && !regex.test(subject));
            if (bad.length > 0) {
              core.setFailed(
                "Commit message(s) do not follow Conventional Commits format " +
                "(type(scope): description, 1-72 chars) -- see AGENTS.md:\n" +
                bad.map((s) => `  "${s}"`).join("\n")
              );
            } else {
              console.log(`✅ All ${commits.length} commit message(s) follow Conventional Commits`);
            }

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
