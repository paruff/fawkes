name: Service Python Tests

# Generalized lint+test CI for every services/*/ directory with a
# requirements.txt that ISN'T already covered by its own dedicated pipeline
# (tracer-bullet-ci.yml, dora-metrics-ci.yml also build+push+sign images,
# so they're excluded here to avoid double-testing).
#
# This job intentionally only lints and tests - it doesn't build or deploy
# anything, unlike the per-service pipelines above.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
  pull_request:
    branches: [main]
    paths:
      - "services/**"

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Job 1: Discover services with a requirements.txt (excluding the two
  # already covered by their own dedicated pipeline)
  # ==========================================================================
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover Python services
        id: discover
        run: |
          services=$(find services -mindepth 1 -maxdepth 1 -type d \
            -exec test -e "{}/requirements.txt" \; -print \
            | sed 's|^services/||' \
            | grep -vE '^(tracer-bullet|dora-metrics|smart-alerting)$' \
            | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "Discovered services: $services"
          echo "matrix=$services" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Job 2: Lint + test each discovered service
  # ==========================================================================
  test:
    name: Test (${{ matrix.service }})
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "services/${{ matrix.service }}/requirements*.txt"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          # Not every service's requirements-dev.txt includes lint/test tools
          # (many have never run in CI before) - guarantee they're present.
          pip install ruff pytest pytest-cov

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check .
          ruff format --check --diff --exclude '*.md' .

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest tests/
          else
            echo "No tests/ directory for ${{ matrix.service }}; skipping"
          fi

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
