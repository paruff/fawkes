name: AI Code Review CI/CD

# Extends the build->scan->sign->SBOM->GitOps-promote pattern (proven on
# python-fawkes-path, dora-metrics, smart-alerting, anomaly-detection) to
# ai-code-review via the shared reusable-python-service-golden-path.yml
# workflow (#1792). Replaces service-python-tests.yml's generic lint-only
# coverage for this service (see the exclusion added there).

on:
  push:
    branches: [main]
    paths:
      - "services/ai-code-review/**"
  pull_request:
    branches: [main]
    paths:
      - "services/ai-code-review/**"

jobs:
  golden-path:
    uses: ./.github/workflows/reusable-python-service-golden-path.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      pull-requests: write # GitOps update PR (main-protection forbids direct push)
    with:
      service-name: ai-code-review
    secrets: inherit
