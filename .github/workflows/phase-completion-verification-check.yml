# docs/elite-engineering-bridge-plan.md Phase 1, item 4: soft-enforce first.
# This ALWAYS passes (exit 0) - it only posts a warning annotation, never
# blocks a merge. Deliberately weak: tighten to a real blocking gate only
# once the golden-path-verification workflow has been running long enough
# to be trusted (per the plan's own risk note - a noisy/flaky gate gets
# ignored and recreates the exact problem this is meant to fix).
name: Phase Completion Verification Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check for a verification-run link
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look for an issue reference and a verification link in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          if echo "$PR_BODY" | grep -qiE '#[0-9]+'; then
            if echo "$PR_BODY" | grep -qE 'actions/runs/[0-9]+'; then
              echo "PR references an issue and links a workflow run - good."
            else
              echo "::warning::This PR references an issue but has no linked verification-run URL (e.g. a golden-path-verification run). Per docs/elite-engineering-bridge-plan.md Phase 1, phase-completion claims should link evidence, not just merge. This is advisory only and does not block merge."
            fi
          fi
          exit 0
