name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # This repo is public: without an author-association check, anyone with
    # a GitHub account could comment "/oc" on any issue/PR and get an agent
    # holding contents:write + actions:write to act on attacker-controlled
    # issue/PR text - a textbook "pwn request" (the write permissions below
    # were previously gated on nothing but the comment author not being a
    # bot). OWNER/MEMBER/COLLABORATOR are the three author_association
    # values GitHub assigns to accounts with write access or higher; every
    # other value (CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER,
    # MANNEQUIN, NONE) means the commenter has no write access to this repo.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      actions: write
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: job-start
        run: echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ) sha:${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      # Pre-install Terraform/TFLint so opencode never needs to self-install
      # them mid-session. Same pinned versions as security-and-terraform.yml.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: 1.15.8

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef  # v6
        with:
          tflint_version: v0.64.0
          github_token: ${{ github.token }}

      # Resolve the model against the LIVE models.dev catalog rather than
      # trusting a hardcoded string. Zen/NVIDIA model IDs have broken us
      # twice this session (wrong provider id on issue #1587's timeout
      # investigation; wrong NVIDIA org/model prefix on issue #1570) --
      # both were catalog-format mistakes we'd have caught immediately by
      # checking the catalog first. This step keeps that check permanent:
      # if our preferred model still exists, use it unchanged (deterministic,
      # same choice every run); if it's been renamed or removed, fall back to
      # another free tool-calling model on the same provider and post a
      # visible ::warning:: so the drift doesn't go unnoticed. Untrusted
      # comment body goes through env:, never interpolated into the script.
      - name: Resolve model
        id: resolve_model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STRONG_MODEL=false
          if echo "$COMMENT_BODY" | grep -qiF '[security]' || echo "$COMMENT_BODY" | grep -qiF '[feature]'; then
            STRONG_MODEL=true
          fi

          # Comment wording alone is a fragile signal: a plain "/oc" on an
          # already-labeled type-security/comp-security issue would silently
          # fall through to the free model with no warning (issue #1651).
          # Label state is the source of truth and doesn't need to be
          # re-typed correctly on every trigger comment. The issues API
          # covers PR labels too, so this works for both trigger events.
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            LABELS=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -qE '(^|,)(type-security|comp-security)(,|$)'; then
              STRONG_MODEL=true
              echo "Issue/PR #${ISSUE_NUMBER} carries a security label ($LABELS) -- forcing the stronger model."
            fi
          fi

          if [ "$STRONG_MODEL" = "true" ]; then
            # Switched from nvidia/nvidia/nemotron-3-ultra-550b-a55b (paid:
            # $0.50/$2.50 per million tokens via NVIDIA's own API, confirmed
            # live against models.dev) to opencode's own Zen-hosted free
            # variant of the same model family - confirmed live via Zen's
            # docs page and cross-checked against models.dev
            # ($0/$0/$0, tool_call=true, 1M context, not deprecated). Same
            # model tier, no cost, as long as Zen keeps offering it free -
            # Zen's own docs note free-tier models are promotional
            # ("collecting feedback"), so re-verify this if it ever breaks.
            PREFERRED="opencode/nemotron-3-ultra-free"
          else
            # deepseek-v4-flash-free was removed here after a real run failed
            # with "Model not found: opencode/deepseek-v4-flash-free" even
            # though models.dev's catalog still listed it as existing at the
            # time - the live-catalog check below caught renames/removals
            # from the catalog itself, but not this kind of catalog/runtime
            # drift (the model was gone from opencode's actual backend before
            # the public catalog caught up). mimo-v2.5-free is the current
            # replacement; if this ever breaks the same way, verify against
            # a real invocation, not just the catalog, before trusting it.
            PREFERRED="opencode/mimo-v2.5-free"
          fi

          curl -fsSL https://models.dev/api.json -o /tmp/catalog.json

          PROVIDER="${PREFERRED%%/*}"
          MODEL_ID="${PREFERRED#*/}"

          EXISTS=$(jq --arg p "$PROVIDER" --arg m "$MODEL_ID" '.[$p].models[$m] != null' /tmp/catalog.json)

          if [ "$EXISTS" = "true" ]; then
            echo "model=$PREFERRED" >> "$GITHUB_OUTPUT"
            echo "Model verified against live catalog: $PREFERRED"
            exit 0
          fi

          echo "::warning::Preferred model '$PREFERRED' no longer exists in the live models.dev catalog (renamed or removed) -- falling back to a free tool-calling model on the same provider ($PROVIDER)."

          FALLBACK=$(jq -r --arg p "$PROVIDER" '
            .[$p].models
            | to_entries
            | map(select(.value.cost.input == 0 and .value.cost.output == 0 and .value.tool_call == true))
            | sort_by(.value.release_date // "0000-00-00")
            | reverse
            | .[0].key // empty
          ' /tmp/catalog.json)

          if [ -z "$FALLBACK" ]; then
            echo "::error::No free tool-calling fallback model found for provider $PROVIDER either. Failing closed rather than silently using a paid or non-functional model."
            exit 1
          fi

          echo "::warning::Falling back to $PROVIDER/$FALLBACK"
          echo "model=$PROVIDER/$FALLBACK" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@3104c1428ec91f809e5ab86631300de41eb6952e  # v1.18.30
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          model: ${{ steps.resolve_model.outputs.model }}

      # opencode does not reliably follow this repo's Conventional Commits
      # rule despite it being stated in AGENTS.md and a dedicated skill
      # (.opencode/skills/commit-message-format) -- confirmed non-compliant
      # on PR #1619 and #1625 even with both in place. Documentation alone
      # isn't reliable enough; enforce mechanically instead of hoping.
      - name: Normalize commit message if non-compliant
        if: always()
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "No commits to check."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "No new commits; nothing to normalize."
            exit 0
          fi
          subject="$(git log -1 --format=%s)"
          if echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .{1,72}$'; then
            echo "Commit message already compliant: $subject"
            exit 0
          fi
          echo "Non-compliant commit subject, rewriting: $subject"
          desc="$subject"
          if [ "${#desc}" -gt 69 ]; then
            desc="${desc:0:69}..."
          fi
          body="$(git log -1 --format=%b)"
          {
            echo "fix: ${desc}"
            echo
            echo "Original subject: ${subject}"
            if [ -n "$body" ]; then
              echo
              echo "$body"
            fi
          } > /tmp/normalized_commit_msg.txt
          git commit --amend -F /tmp/normalized_commit_msg.txt
          # Run OpenCode's own push already authenticated via an
          # http.extraheader config; leaving it in place while we also embed
          # a token in the remote URL sends two conflicting credentials on
          # the same request and GitHub rejects both (confirmed root cause
          # of PR #1631's normalize-step push failure: "Invalid username or
          # # token. Password authentication is not supported").
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force-with-lease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: job-finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
