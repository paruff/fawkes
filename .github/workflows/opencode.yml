name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      actions: write
      contents: write
    steps:
      - name: job-start
        run: echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ) sha:${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      # Pre-install Terraform/TFLint so opencode never needs to self-install
      # them mid-session. Same pinned versions as security-and-terraform.yml.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: 1.15.8

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6
        with:
          tflint_version: v0.64.0
          github_token: ${{ github.token }}

      # Install the same commit-msg hook humans get via `make pre-commit-setup`
      # (.pre-commit-config.yaml's conventional-commit-msg hook), so opencode's
      # own `git commit` gets rejected with the actual regex+reason inline and
      # can retry, instead of only finding out from ci-commit-lint.yml after
      # pushing. Only the commit-msg hook type -- not the full pre-commit
      # stage, which runs unrelated file-content checks (tflint, kubeval, ...)
      # that could block a commit for issues in files opencode didn't touch.
      - name: Install commit-msg hook
        run: |
          pip install --quiet pre-commit
          pre-commit install --hook-type commit-msg

      - name: Run OpenCode
        uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d  # v1.18.18
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          # Model routing by comment tag: default is the free Zen model;
          # add [security] or [feature] anywhere in the comment to route to
          # NVIDIA NIM's nemotron-3-ultra (1M context) instead, e.g.
          # "/oc [security] fix this CVE". build.nvidia.com labels this
          # endpoint "Free Endpoint" in its own product metadata — do not
          # trust models.dev's cost field for NVIDIA NIM models without
          # cross-checking build.nvidia.com directly, it has been wrong here.
          # The bracket tag is required for THIS routing expression to match
          # ("/oc-security ..." does not contain "[security]" so it silently
          # falls through to the default model below) — confirmed live:
          # "/oc-security ..." does still trigger the action itself (issue
          # #1587, run 32296616870), just without escalating the model.
          #
          # Model string is doubled ("nvidia/nvidia/...") deliberately, not a
          # typo: NVIDIA-published models on NVIDIA's own NIM catalog carry
          # "nvidia/" as part of the model's own org/name identifier (an
          # org/model convention, same as e.g. "microsoft/phi-4-..." models
          # hosted on the same catalog) -- confirmed against models.dev's raw
          # JSON directly (data['nvidia']['models'] keys). opencode splits on
          # the FIRST "/" only for provider vs. model, so referencing this
          # specific model needs provider "nvidia" + catalog key
          # "nvidia/nemotron-3-ultra-550b-a55b" == "nvidia/nvidia/...". The
          # single-prefixed form failed on issue #1570 with "Model not found:
          # nvidia/nemotron-3-ultra-550b-a55b. Did you mean:
          # nvidia/nemotron-3-ultra-550b-a55b?" -- both sides of that message
          # render identically because the suggestion is the raw catalog key,
          # not re-prefixed with the provider (confirmed in opencode's
          # ModelNotFoundError source), which is what made this non-obvious.
          model: ${{ (contains(github.event.comment.body, '[security]') || contains(github.event.comment.body, '[feature]')) && 'nvidia/nvidia/nemotron-3-ultra-550b-a55b' || 'opencode/deepseek-v4-flash-free' }}

      # opencode does not reliably follow this repo's Conventional Commits
      # rule despite it being stated in AGENTS.md and a dedicated skill
      # (.opencode/skills/commit-message-format) -- confirmed non-compliant
      # on PR #1619 and #1625 even with both in place. Documentation alone
      # isn't reliable enough; enforce mechanically instead of hoping.
      - name: Normalize commit message if non-compliant
        if: always()
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "No commits to check."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "No new commits; nothing to normalize."
            exit 0
          fi
          subject="$(git log -1 --format=%s)"
          if echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .{1,72}$'; then
            echo "Commit message already compliant: $subject"
            exit 0
          fi
          echo "Non-compliant commit subject, rewriting: $subject"
          desc="$subject"
          if [ "${#desc}" -gt 69 ]; then
            desc="${desc:0:69}..."
          fi
          body="$(git log -1 --format=%b)"
          {
            echo "fix: ${desc}"
            echo
            echo "Original subject: ${subject}"
            if [ -n "$body" ]; then
              echo
              echo "$body"
            fi
          } > /tmp/normalized_commit_msg.txt
          git commit --amend -F /tmp/normalized_commit_msg.txt
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force-with-lease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: job-finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
