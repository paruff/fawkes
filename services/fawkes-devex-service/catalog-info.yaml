apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fawkes-devex-service
  title: Fawkes DevEx Service
  description: >
    Consolidated developer experience domain monolith. Combines Feedback,
    Feedback Bot, NPS Surveys, DevEx Survey Automation, Insights, and
    Experimentation into a single FastAPI service.
  annotations:
    backstage.io/managed-by-location: url:https://github.com/paruff/fawkes/blob/main/services/fawkes-devex-service/catalog-info.yaml
    github.com/project-slug: paruff/fawkes
  tags:
    - python
    - fastapi
    - devex
    - feedback
  links:
    - url: https://backstage.fawkes.idp
      title: Backstage Portal
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: fawkes
  providesApis:
    - fawkes-devex-service
  dependsOn:
    - resource:fawkes-postgresql
